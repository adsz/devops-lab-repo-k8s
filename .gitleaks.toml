title = "devops-lab allowlist"
[extend]
useDefault = true

[allowlist]
description = "Known-safe patterns (UUIDs, example creds in docs/scripts)"
regexTarget = "match"
regexes = [
    # UUIDs (KMS key IDs, resource IDs — public identifiers)
    '''[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}''',
    # Example creds admin:admin123, user:pass, etc. in docs
    '''admin:[a-z0-9]+123''',
    '''example[-_]?(password|secret|token)''',
    '''your[-_]?(password|secret|token|key)''',
    '''changeme''',
    '''REPLACE[-_]?ME''',
]
paths = [
    '''.*\.md$''',
    '''docs/.*''',
    '''MIGRATION-.*''',
    '''FINAL-STRUCTURE.*''',
    '''README.*''',
    # Shell scripts often contain example commands with placeholder creds
    '''scripts/.*\.sh$''',
    '''.*\.example.*''',
]
