title = "svc-k8s-local allowlist"
[extend]
useDefault = true

[allowlist]
description = "Known-safe patterns + SSH public host keys in test logs"
regexTarget = "match"
regexes = [
    '''[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}''',
    '''admin:[a-z0-9]+123''',
    '''example[-_]?(password|secret|token)''',
    '''changeme''',
    # SSH public host keys (AAAA... base64) — these are PUBLIC, not secrets
    '''AAAA[A-Za-z0-9+/]{20,}={0,2}''',
]
paths = [
    '''.*\.md$''',
    '''docs/.*''',
    '''README.*''',
    '''scripts/.*\.sh$''',
    '''.*\.example.*''',
    # Ansible test output logs contain public host keys
    '''.*test.*output.*\.log$''',
    '''.*precheck.*\.log$''',
]
