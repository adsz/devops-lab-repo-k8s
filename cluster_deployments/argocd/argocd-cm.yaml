apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-cm
    app.kubernetes.io/part-of: argocd
data:
  # Enable anonymous access (disable for production)
  # users.anonymous.enabled: "false"

  # Git repository settings
  timeout.reconciliation: "180s"

  # Resource tracking method (use annotation for better compatibility)
  application.resourceTrackingMethod: "annotation"

  # Enable exec for debugging
  exec.enabled: "true"

  # UI customization
  ui.bannercontent: "Enterprise GitOps Platform"
  ui.bannerurl: "https://github.com/argoproj/argo-cd"

  # Helm repositories (examples)
  repositories: |
    - type: helm
      name: stable
      url: https://charts.helm.sh/stable
    - type: helm
      name: prometheus-community
      url: https://prometheus-community.github.io/helm-charts
    - type: helm
      name: ingress-nginx
      url: https://kubernetes.github.io/ingress-nginx
    - type: helm
      name: jetstack
      url: https://charts.jetstack.io
    - type: helm
      name: bitnami
      url: https://charts.bitnami.com/bitnami

  # Resource exclusions (performance optimization)
  resource.exclusions: |
    - apiGroups:
      - cilium.io
      kinds:
      - CiliumIdentity
      clusters:
      - "*"

  # Resource customizations
  resource.customizations: |
    networking.k8s.io/Ingress:
      health.lua: |
        hs = {}
        hs.status = "Healthy"
        return hs