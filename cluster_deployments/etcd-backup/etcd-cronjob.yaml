---
# Namespace for ETCD backups
apiVersion: v1
kind: Namespace
metadata:
  name: etcd-full-backup
  labels:
    app.kubernetes.io/name: etcd-backup
    app.kubernetes.io/component: backup

---
# Dedicated ServiceAccount for backup job
apiVersion: v1
kind: ServiceAccount
metadata:
  name: etcd-backup
  namespace: etcd-full-backup
  labels:
    app.kubernetes.io/name: etcd-backup
    app.kubernetes.io/component: backup

---
# Etcd backup CronJob (Secret must already exist)
apiVersion: batch/v1
kind: CronJob
metadata:
  name: etcd-backup
  namespace: etcd-full-backup
  labels:
    app.kubernetes.io/name: etcd-backup
    app.kubernetes.io/component: backup
    app.kubernetes.io/managed-by: kubectl
spec:
  schedule: "0 */6 * * *" # Every 6 hours
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: etcd-backup
            app.kubernetes.io/component: backup
        spec:
          restartPolicy: OnFailure
          serviceAccountName: etcd-backup
          securityContext:
            # Run as root so we can access hostPath-mounted etcd data/certs safely.
            runAsUser: 0
            runAsGroup: 0
            fsGroup: 0
            # Use default kernel seccomp profile for baseline hardening without custom policy.
            seccompProfile:
              type: RuntimeDefault
          nodeSelector:
            node-role.kubernetes.io/control-plane: ""
          tolerations:
          - effect: NoSchedule
            operator: Exists
          - effect: NoExecute
            operator: Exists
          hostNetwork: true
          hostPID: true
          containers:
          - name: etcd-backup
            # Use Alpine - small and fast
            image: alpine:3.19
            imagePullPolicy: IfNotPresent
            command:
            - /bin/sh
            - -c
            - |
              set -e

              # Install AWS CLI, curl, gzip
              apk add --no-cache aws-cli curl gzip

              # Install etcdctl
              ETCD_VER=v3.5.16
              curl -sSfL --retry 5 --retry-delay 5 https://github.com/etcd-io/etcd/releases/download/${ETCD_VER}/etcd-${ETCD_VER}-linux-amd64.tar.gz | tar xz
              mv etcd-${ETCD_VER}-linux-amd64/etcdctl /usr/local/bin/
              mv etcd-${ETCD_VER}-linux-amd64/etcdutl /usr/local/bin/
              rm -rf etcd-${ETCD_VER}-linux-amd64

              # Configuration
              ETCD_ENDPOINTS="https://127.0.0.1:2379"
              ETCD_CACERT="/etc/kubernetes/pki/etcd/ca.crt"
              ETCD_CERT="/etc/kubernetes/pki/etcd/server.crt"
              ETCD_KEY="/etc/kubernetes/pki/etcd/server.key"
              BACKUP_DIR="/tmp/etcd-backup"
              S3_BUCKET="aws5-k8s-backup"
              S3_PREFIX="etcd-full-backup"

              # Create backup directory
              mkdir -p ${BACKUP_DIR}

              # Create snapshot with NEW naming convention
              TIMESTAMP=$(date +%Y%m%d-%H%M%S)
              SNAPSHOT_FILE="${BACKUP_DIR}/etcd-full-backup-${TIMESTAMP}.db"

              echo "Creating ETCD full backup..."
              ETCDCTL_API=3 etcdctl \
                --endpoints=${ETCD_ENDPOINTS} \
                --cacert=${ETCD_CACERT} \
                --cert=${ETCD_CERT} \
                --key=${ETCD_KEY} \
                snapshot save "${SNAPSHOT_FILE}"

              # Verify snapshot
              echo "Verifying ETCD snapshot..."
              etcdutl snapshot status "${SNAPSHOT_FILE}"

              # Compress snapshot
              echo "Compressing snapshot..."
              gzip "${SNAPSHOT_FILE}"
              SNAPSHOT_FILE="${SNAPSHOT_FILE}.gz"

              # Upload to S3 in etcd-full-backup folder
              echo "Uploading to S3..."
              aws s3 cp "${SNAPSHOT_FILE}" \
                "s3://${S3_BUCKET}/${S3_PREFIX}/$(basename ${SNAPSHOT_FILE})" \
                --storage-class STANDARD_IA \
                --no-progress \
                --metadata timestamp="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

              echo "ETCD backup completed successfully"
              echo "Uploaded: s3://${S3_BUCKET}/${S3_PREFIX}/$(basename ${SNAPSHOT_FILE})"

              # Send success notification
              aws sns publish \
                --topic-arn "arn:aws:sns:eu-central-1:112779685446:k8s-production-backup-notifications" \
                --subject "ETCD Full Backup SUCCESS - $(hostname)" \
                --message "ETCD full backup completed successfully at $(date). File: $(basename ${SNAPSHOT_FILE})" \
                --region eu-central-1 || true

            env:
            - name: AWS_REGION
              value: "eu-central-1"
            - name: AWS_MAX_ATTEMPTS
              value: "5"
            # FIXED: Load credentials from Secret instead of hardcoded
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: aws-etcd-backup-credentials
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: aws-etcd-backup-credentials
                  key: AWS_SECRET_ACCESS_KEY
            resources:
              limits:
                cpu: 500m
                memory: 512Mi
              requests:
                cpu: 100m
                memory: 128Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
            volumeMounts:
            - name: etcd-certs
              mountPath: /etc/kubernetes/pki/etcd
              readOnly: true
            - name: etcd-data
              mountPath: /var/lib/etcd
              readOnly: true
          volumes:
          - name: etcd-certs
            hostPath:
              path: /etc/kubernetes/pki/etcd
              type: Directory
          - name: etcd-data
            hostPath:
              path: /var/lib/etcd
              type: Directory
