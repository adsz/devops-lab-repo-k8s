apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-applicationsets
  namespace: argocd
  labels:
    app: root
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/adsz/devops-lab-repo-k8s.git
    targetRevision: WIP
    path: argocd-applicationsets

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true

  # Root app zarządza ApplicationSets
  # ApplicationSets następnie zarządzają wszystkimi aplikacjami
