apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "redis-diagnostic.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    app: redis
    app.kubernetes.io/name: redis
    app.kubernetes.io/category: diagnostic
    app.kubernetes.io/component: database
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - containerPort: 6379
          name: redis
        {{- if .Values.redis.password }}
        env:
        - name: REDIS_PASSWORD
          value: {{ .Values.redis.password | quote }}
        {{- end }}
        args:
        - --maxmemory
        - {{ .Values.redis.maxMemory | quote }}
        - --maxmemory-policy
        - {{ .Values.redis.maxMemoryPolicy | quote }}
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        {{- if .Values.persistence.enabled }}
        volumeMounts:
        - name: data
          mountPath: /data
        {{- end }}
      {{- if .Values.persistence.enabled }}
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: {{ include "redis-diagnostic.fullname" . }}-pvc
      {{- end }}
