apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.namePrefix }}blog-db-secret
  namespace: {{ .Values.namePrefix }}demo-blog
type: Opaque
stringData:
  POSTGRES_DB: {{ .Values.database.name }}
  POSTGRES_USER: {{ .Values.database.user }}
  POSTGRES_PASSWORD: {{ .Values.database.password }}
  DB_HOST: {{ .Values.namePrefix }}blog-db
  DB_NAME: {{ .Values.database.name }}
  DB_USER: {{ .Values.database.user }}
  DB_PASS: {{ .Values.database.password }}
