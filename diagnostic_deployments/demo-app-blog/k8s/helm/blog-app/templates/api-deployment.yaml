apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.namePrefix }}blog-api
  namespace: {{ .Values.namePrefix }}demo-blog
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.namePrefix }}blog-api
  template:
    metadata:
      labels:
        app: {{ .Values.namePrefix }}blog-api
        deployment-method: helm
    spec:
      initContainers:
      - name: wait-for-db
        image: busybox:1.36
        command: ['sh', '-c', 'until nc -z {{ .Values.namePrefix }}blog-db 5432; do sleep 2; done']
      containers:
      - name: api
        image: {{ .Values.images.api.repository }}:{{ .Values.images.api.tag }}
        ports:
        - containerPort: 5000
        envFrom:
        - configMapRef:
            name: {{ .Values.namePrefix }}blog-api-config
        - secretRef:
            name: {{ .Values.namePrefix }}blog-db-secret
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
