apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: k-demo-blog
namePrefix: k-

resources:
- namespace.yaml
- api-configmap.yaml
- api-deployment.yaml
- api-service.yaml
- cache-deployment.yaml
- cache-service.yaml
- database-secret.yaml
- database-statefulset.yaml
- database-service.yaml
- frontend-deployment.yaml
- frontend-service.yaml

commonLabels:
  deployment-method: kustomize
  
# Change NodePorts
patches:
- target:
    kind: Service
    name: blog-frontend
  patch: |-
    - op: replace
      path: /spec/ports/0/nodePort
      value: 30081
- target:
    kind: Service
    name: blog-api
  patch: |-
    - op: replace
      path: /spec/ports/0/nodePort
      value: 30051
