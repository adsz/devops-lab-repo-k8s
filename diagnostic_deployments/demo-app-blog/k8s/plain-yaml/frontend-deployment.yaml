apiVersion: apps/v1
kind: Deployment
metadata:
  name: blog-frontend
  namespace: demo-blog
  labels:
    app: blog-frontend
    component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: blog-frontend
  template:
    metadata:
      labels:
        app: blog-frontend
        component: frontend
    spec:
      containers:
      - name: nginx
        image: harbor.devops-lab.cloud/k8s-diagnostic-demos/blog-frontend:1.0
        imagePullPolicy: Always
        command: ["/bin/sh", "-c"]
        args:
        - |
          sed -i 's|Demo Application for K8s Diagnostic Tools|ELO4 Demo Application for K8s Diagnostic Tools<br>Deployed with Plain YAML Method|g' /usr/share/nginx/html/index.html
          exec nginx -g 'daemon off;'
        ports:
        - containerPort: 80
          name: http
        resources:
          requests:
            memory: "32Mi"
            cpu: "50m"
          limits:
            memory: "64Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
