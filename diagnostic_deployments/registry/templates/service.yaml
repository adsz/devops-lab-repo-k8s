apiVersion: v1
kind: Service
metadata:
  name: {{ include "registry-diagnostic.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    app: registry
    app.kubernetes.io/name: registry
spec:
  type: {{ .Values.service.type }}
  ports:
  - port: {{ .Values.service.port }}
    targetPort: registry
    protocol: TCP
    name: registry
  selector:
    app: registry
