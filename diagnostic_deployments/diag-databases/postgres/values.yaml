replicaCount: 1

image:
  repository: postgres
  tag: "16-alpine"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 5432

resources:
  requests:
    memory: "256Mi"
    cpu: "200m"
  limits:
    memory: "512Mi"
    cpu: "500m"

persistence:
  enabled: false
  size: 5Gi
  storageClass: ""

postgres:
  database: testdb
  user: postgres
  password: postgres

namespace: diagnostic-db
