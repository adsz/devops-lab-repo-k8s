apiVersion: v1
kind: Service
metadata:
  name: {{ include "postgres-diagnostic.fullname" . }}
  labels:
    app: postgres
    app.kubernetes.io/name: postgres
spec:
  type: {{ .Values.service.type }}
  ports:
  - port: {{ .Values.service.port }}
    targetPort: postgres
    protocol: TCP
    name: postgres
  selector:
    app: postgres
