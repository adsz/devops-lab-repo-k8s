replicaCount: 1

image:
  repository: redis
  tag: "7-alpine"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 6379

resources:
  requests:
    memory: "128Mi"
    cpu: "100m"
  limits:
    memory: "256Mi"
    cpu: "200m"

persistence:
  enabled: false
  size: 1Gi
  storageClass: ""

redis:
  password: ""
  maxMemory: "256mb"
  maxMemoryPolicy: "allkeys-lru"

namespace: diagnostic-db
