apiVersion: v1
kind: Service
metadata:
  name: {{ include "redis-diagnostic.fullname" . }}
  labels:
    app: redis
    app.kubernetes.io/name: redis
spec:
  type: {{ .Values.service.type }}
  ports:
  - port: {{ .Values.service.port }}
    targetPort: redis
    protocol: TCP
    name: redis
  selector:
    app: redis
