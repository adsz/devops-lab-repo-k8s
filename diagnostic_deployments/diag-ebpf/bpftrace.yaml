apiVersion: v1
kind: ServiceAccount
metadata:
  name: bpftrace
  labels:
    app.kubernetes.io/category: diagnostic
    app.kubernetes.io/component: ebpf
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: bpftrace
  labels:
    app.kubernetes.io/category: diagnostic
    app.kubernetes.io/component: ebpf
rules:
- apiGroups: [""]
  resources: ["pods", "nodes"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: bpftrace
  labels:
    app.kubernetes.io/category: diagnostic
    app.kubernetes.io/component: ebpf
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: bpftrace
subjects:
- kind: ServiceAccount
  name: bpftrace
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: bpftrace
  labels:
    app: bpftrace
    app.kubernetes.io/category: diagnostic
    app.kubernetes.io/component: ebpf
spec:
  selector:
    matchLabels:
      app: bpftrace
  template:
    metadata:
      labels:
        app: bpftrace
    spec:
      serviceAccountName: bpftrace
      hostPID: true
      hostNetwork: true
      containers:
      - name: bpftrace
        image: quay.io/iovisor/bpftrace:latest
        command: ["sh", "-c", "sleep infinity"]
        securityContext:
          privileged: true
          capabilities:
            add:
            - SYS_ADMIN
            - SYS_RESOURCE
            - SYS_PTRACE
            - NET_ADMIN
            - NET_RAW
        volumeMounts:
        - name: sys
          mountPath: /sys
          readOnly: true
        - name: kernel-debug
          mountPath: /sys/kernel/debug
        - name: modules
          mountPath: /lib/modules
          readOnly: true
        - name: usr-src
          mountPath: /usr/src
          readOnly: true
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "500m"
      volumes:
      - name: sys
        hostPath:
          path: /sys
      - name: kernel-debug
        hostPath:
          path: /sys/kernel/debug
      - name: modules
        hostPath:
          path: /lib/modules
      - name: usr-src
        hostPath:
          path: /usr/src
      tolerations:
      - effect: NoSchedule
        operator: Exists
