apiVersion: v1
kind: Pod
metadata:
  name: network-multitool
  labels:
    app: network-multitool
    app.kubernetes.io/category: diagnostic
    app.kubernetes.io/component: network-debug
spec:
  containers:
  - name: network-multitool
    image: praqma/network-multitool:latest
    env:
    - name: HTTP_PORT
      value: "8080"
    - name: HTTPS_PORT
      value: "8443"
    ports:
    - containerPort: 8080
      name: http
    - containerPort: 8443
      name: https
    securityContext:
      capabilities:
        add: ["NET_ADMIN", "NET_RAW"]
    resources:
      requests:
        memory: "128Mi"
        cpu: "100m"
      limits:
        memory: "256Mi"
        cpu: "200m"
  restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: network-multitool
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    name: http
  - port: 8443
    targetPort: 8443
    name: https
  selector:
    app: network-multitool
