apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "registry-diagnostic.fullname" . }}
  labels:
    app: registry
    app.kubernetes.io/name: registry
    app.kubernetes.io/category: diagnostic
    app.kubernetes.io/component: registry
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: registry
  template:
    metadata:
      labels:
        app: registry
    spec:
      containers:
      - name: registry
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - containerPort: 5000
          name: registry
        env:
        - name: REGISTRY_STORAGE_DELETE_ENABLED
          value: {{ .Values.registry.storage.delete.enabled | quote }}
        - name: REGISTRY_HTTP_ADDR
          value: {{ .Values.registry.http.addr | quote }}
        - name: REGISTRY_HTTP_SECRET
          value: {{ .Values.registry.http.secret | quote }}
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        {{- if .Values.persistence.enabled }}
        volumeMounts:
        - name: data
          mountPath: /var/lib/registry
        {{- end }}
      {{- if .Values.persistence.enabled }}
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: {{ include "registry-diagnostic.fullname" . }}-pvc
      {{- end }}
