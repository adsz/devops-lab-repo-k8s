# Simplified Velero Helm Chart Values for Enterprise Kubernetes Backup

# Velero server configuration
image:
  repository: velero/velero
  pullPolicy: IfNotPresent

# Resource requests and limits
resources:
  requests:
    cpu: 500m
    memory: 128Mi
  limits:
    cpu: 1000m
    memory: 512Mi

# Service account configuration
serviceAccount:
  server:
    create: true
    name: velero

# RBAC configuration
rbac:
  create: true

# Credentials configuration for AWS
credentials:
  useSecret: true
  name: cloud-credentials
  # Secret contents are provisioned via cloud-credentials.conf (gitignored) and created during install.

# Configuration for backup storage location
configuration:
  backupStorageLocation:
    - name: default
      provider: aws
      bucket: aws5-k8s-backup
      config:
        region: eu-central-1
        serverSideEncryption: AES256
  
  volumeSnapshotLocation:
    - name: default
      provider: aws
      config:
        region: eu-central-1

# Metrics for monitoring
metrics:
  enabled: true

# Deploy node agent for file-level backup
deployNodeAgent: true

# AWS plugin
initContainers:
  - name: velero-plugin-for-aws
    image: velero/velero-plugin-for-aws:v1.8.0
    imagePullPolicy: IfNotPresent
    volumeMounts:
      - mountPath: /target
        name: plugins

# Default file system backup
defaultVolumesToFsBackup: true
