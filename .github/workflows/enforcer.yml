# Branch Protection Enforcer
# Blocks direct pushes to main — only dev/fix/hotfix branches allowed to merge
name: Branch Enforcer

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  pull-requests: write
  statuses: write

jobs:
  enforce:
    runs-on: devops-lab-runners
    steps:
      - name: Check source branch
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const head = context.payload.pull_request.head.ref;
            const allowed = /^(dev|release\/v\d+\.\d+\.\d+|hotfix\/.+)$/;
            if (!allowed.test(head)) {
              const msg = `❌ Branch \`${head}\` cannot target \`main\` directly.\n\n` +
                `Only \`dev\`, \`release/vX.Y.Z\`, and \`hotfix/*\` branches may merge to \`main\`.\n` +
                `Please target \`dev\` instead.`;
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body: msg,
              });
              core.setFailed(msg);
            } else {
              core.info(`✅ Branch ${head} is allowed to target main`);
            }
